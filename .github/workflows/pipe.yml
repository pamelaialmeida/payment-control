name: Private Payment Control CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Fazer checkout do repositorio
      uses: actions/checkout@v4

    - name: Definir versao do Node
      uses: actions/setup-node@v4
      with:
        node-version: "20.x"

    - name: Instalar dependencias
      run: npm install
    
    - name: Iniciar API e executar testes
      uses: BerniWittmann/background-server-action@v1
      with:
        start: npm start
        wait-on: 'http://localhost:4000/graphql'
        command: npm test